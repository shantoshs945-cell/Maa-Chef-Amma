<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Maa Chef Amma</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold: #C9A025; --gold-light: #E8BC45;
      --dark: #0A0A0A; --dark-2: #111111; --dark-3: #1A1A1A;
      --cream: #F5EDD6; --muted: #888880; --red: #C0392B;
      --radius: 12px; --radius-sm: 8px;
    }
    body { font-family: 'DM Sans', sans-serif; background: var(--dark); color: var(--cream); min-height: 100vh; display: flex; flex-direction: column; }
    nav { display: flex; align-items: center; justify-content: space-between; padding: 1rem 2rem; height: 64px; background: rgba(10,10,10,0.9); border-bottom: 0.5px solid rgba(201,160,37,0.15); }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { width: 36px; height: 36px; border-radius: 50%; }
    .nav-logo-text { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--cream); }
    .nav-logo-text span { color: var(--gold); font-style: italic; }
    .back-link { font-size: 13px; color: var(--muted); text-decoration: none; display: flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .back-link:hover { color: var(--gold); }

    .login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .login-box { background: var(--dark-2); border: 0.5px solid rgba(201,160,37,0.2); border-radius: var(--radius); padding: 2.5rem; width: 440px; max-width: 100%; }

    .login-logo { text-align: center; margin-bottom: 2rem; }
    .login-logo img { width: 90px; height: 90px; border-radius: 50%; margin-bottom: 0.8rem; border: 2px solid rgba(201,160,37,0.3); }
    .login-logo h2 { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: var(--cream); }
    .login-logo h2 em { color: var(--gold); font-style: italic; }
    .login-logo p { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }

    /* TABS */
    .auth-tabs { display: flex; background: var(--dark-3); border-radius: var(--radius-sm); padding: 4px; margin-bottom: 1.8rem; }
    .auth-tab { flex: 1; padding: 9px; text-align: center; font-size: 0.82rem; font-weight: 500; border-radius: 6px; cursor: pointer; transition: all 0.2s; color: var(--muted); }
    .auth-tab.active { background: var(--gold); color: var(--dark); }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.08em; }
    .form-group input, .form-group textarea { width: 100%; background: var(--dark-3); border: 0.5px solid rgba(201,160,37,0.2); border-radius: var(--radius-sm); padding: 11px 14px; font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--cream); outline: none; transition: border-color 0.2s; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--gold); }
    .form-group input::placeholder, .form-group textarea::placeholder { color: var(--muted); }
    .btn-auth { width: 100%; background: var(--gold); color: var(--dark); border: none; border-radius: var(--radius-sm); padding: 13px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: all 0.25s; margin-top: 0.5rem; letter-spacing: 0.06em; }
    .btn-auth:hover { background: var(--gold-light); transform: translateY(-1px); }
    .auth-error { background: rgba(192,57,43,0.1); border: 0.5px solid rgba(192,57,43,0.3); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 13px; color: #FF6B6B; margin-bottom: 1rem; display: none; }
    .form-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 1rem; line-height: 1.6; }
  </style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <img src="logo.png" alt="Logo">
    <div class="nav-logo-text">Maa Chef <span>Amma</span></div>
  </a>
  <a href="index.html" class="back-link"><i class="ti ti-arrow-left"></i> Back to Shop</a>
</nav>

<div class="login-wrap">
  <div class="login-box">
    <div class="login-logo">
      <img src="logo.png" alt="Maa Chef Amma">
      <h2>Welcome to <em>Amma's</em></h2>
      <p>Sign in or create an account to place orders</p>
    </div>

    <!-- TABS -->
    <div class="auth-tabs">
      <div class="auth-tab active" onclick="switchTab('login')">Sign In</div>
      <div class="auth-tab" onclick="switchTab('signup')">New Account</div>
    </div>

    <div id="authError" class="auth-error"></div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="loginPhone" placeholder="+91 XXXXX XXXXX" maxlength="15">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-auth" onclick="doLogin()">Sign In</button>
      <p class="form-note">Don't have an account? <span style="color:var(--gold);cursor:pointer;" onclick="switchTab('signup')">Create one →</span></p>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm" style="display:none;">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="signupName" placeholder="Your full name">
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" id="signupPhone" placeholder="+91 XXXXX XXXXX" maxlength="15">
      </div>
      <div class="form-group">
        <label>Delivery Address</label>
        <textarea id="signupAddress" rows="2" style="resize:none;" placeholder="Street, City, Pincode"></textarea>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="Min 6 characters" onkeydown="if(event.key==='Enter')doSignup()">
      </div>
      <button class="btn-auth" onclick="doSignup()">Create Account</button>
      <p class="form-note">Already have an account? <span style="color:var(--gold);cursor:pointer;" onclick="switchTab('login')">Sign in →</span></p>
    </div>

  </div>
</div>

<script>
  // Check if already logged in
  const existingUser = JSON.parse(localStorage.getItem('mca_user') || 'null');
  if (existingUser) {
    const redirect = sessionStorage.getItem('redirectAfterLogin') || 'index.html';
    sessionStorage.removeItem('redirectAfterLogin');
    window.location.href = redirect;
  }

  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach((t, i) => {
      t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'signup'));
    });
    document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    document.getElementById('authError').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.style.display = 'block';
  }

  function doLogin() {
    const phone = document.getElementById('loginPhone').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!phone || !password) { showError('Please fill in all fields.'); return; }

    // Get all users
    const users = JSON.parse(localStorage.getItem('mca_users') || '[]');
    const user = users.find(u => u.phone === phone && u.password === password);
    if (!user) { showError('Invalid phone or password. Please try again.'); return; }

    // Save session
    localStorage.setItem('mca_user', JSON.stringify({ name: user.name, phone: user.phone, address: user.address }));
    const redirect = sessionStorage.getItem('redirectAfterLogin') || 'index.html';
    sessionStorage.removeItem('redirectAfterLogin');
    window.location.href = redirect;
  }

  function doSignup() {
    const name = document.getElementById('signupName').value.trim();
    const phone = document.getElementById('signupPhone').value.trim();
    const address = document.getElementById('signupAddress').value.trim();
    const password = document.getElementById('signupPassword').value;

    if (!name || !phone || !password) { showError('Name, phone and password are required.'); return; }
    if (password.length < 6) { showError('Password must be at least 6 characters.'); return; }

    // Check if phone already exists
    const users = JSON.parse(localStorage.getItem('mca_users') || '[]');
    if (users.find(u => u.phone === phone)) { showError('This phone number is already registered. Please sign in.'); return; }

    // Save user
    users.push({ name, phone, address, password });
    localStorage.setItem('mca_users', JSON.stringify(users));
    localStorage.setItem('mca_user', JSON.stringify({ name, phone, address }));

    const redirect = sessionStorage.getItem('redirectAfterLogin') || 'index.html';
    sessionStorage.removeItem('redirectAfterLogin');
    window.location.href = redirect;
  }
</script>
</body>
</html>
