<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — Maa Chef Amma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --brand:#B5451B;--brand-light:#FAECE7;--brand-dark:#712B13;
      --gold:#BA7517;--gold-light:#FAEEDA;
      --premix:#3B6D11;--premix-light:#EAF3DE;--premix-dark:#27500A;
      --text:#2C2C2A;--muted:#5F5E5A;--surface:#F1EFE8;--white:#fff;
      --radius:12px;--radius-sm:8px;
    }
    body{font-family:'DM Sans',sans-serif;color:var(--text);background:#FAFAF8;}

    /* NAV */
    nav{background:var(--white);border-bottom:0.5px solid #D3D1C7;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;}
    .logo{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--brand-dark);letter-spacing:0.5px;text-decoration:none;}
    .logo span{color:var(--brand);font-size:13px;display:block;font-family:'DM Sans',sans-serif;font-weight:300;letter-spacing:2px;text-transform:uppercase;}
    .nav-right{display:flex;align-items:center;gap:1.5rem;}
    .nav-link{font-size:14px;color:var(--muted);cursor:pointer;transition:color .2s;text-decoration:none;}
    .nav-link:hover{color:var(--brand);}
    .back-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);text-decoration:none;transition:color .2s;}
    .back-btn:hover{color:var(--brand);}

    /* BREADCRUMB */
    .breadcrumb{padding:1rem 2rem;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--white);border-bottom:0.5px solid #F1EFE8;}
    .breadcrumb a{color:var(--muted);text-decoration:none;}
    .breadcrumb a:hover{color:var(--brand);}
    .breadcrumb span{color:var(--brand);}

    /* LOADING / ERROR */
    .loading-state{text-align:center;padding:5rem 2rem;color:var(--muted);}
    .loading-state i{font-size:48px;display:block;margin-bottom:1rem;opacity:0.3;}

    /* PRODUCT LAYOUT */
    .product-page{max-width:1100px;margin:0 auto;padding:2.5rem 2rem;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:start;}
    @media(max-width:768px){.product-page{grid-template-columns:1fr;gap:1.5rem;padding:1.5rem 1rem;}}

    /* PRODUCT IMAGE */
    .product-visual{position:sticky;top:84px;}
    .product-img-box{width:100%;aspect-ratio:1/1;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
    .product-img-box.pickle-bg{background:linear-gradient(135deg,#FAECE7,#F5D5C8);}
    .product-img-box.premix-bg{background:linear-gradient(135deg,#EAF3DE,#D4E8C0);}
    .product-img-box i{font-size:100px;opacity:0.3;}
    .product-img-box.pickle-bg i{color:var(--brand-dark);}
    .product-img-box.premix-bg i{color:var(--premix-dark);}
    .product-badge-large{position:absolute;top:1.2rem;left:1.2rem;padding:5px 14px;border-radius:20px;font-size:12px;font-weight:500;}
    .badge-bestseller{background:var(--gold);color:white;}
    .badge-new{background:var(--brand);color:white;}

    /* THUMBNAIL ROW */
    .thumb-row{display:flex;gap:10px;margin-top:1rem;}
    .thumb{width:64px;height:64px;border-radius:var(--radius-sm);border:2px solid transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .2s;}
    .thumb.active{border-color:var(--brand);}
    .thumb.pickle-bg{background:var(--brand-light);}
    .thumb.premix-bg{background:var(--premix-light);}
    .thumb i{font-size:24px;}
    .thumb.pickle-bg i{color:var(--brand-dark);}
    .thumb.premix-bg i{color:var(--premix-dark);}

    /* PRODUCT INFO */
    .product-info{display:flex;flex-direction:column;gap:1.2rem;}
    .product-category-tag{display:inline-block;padding:3px 12px;border-radius:20px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.5px;}
    .tag-pickle{background:var(--brand-light);color:var(--brand-dark);}
    .tag-premix{background:var(--premix-light);color:var(--premix-dark);}
    .product-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:600;color:var(--brand-dark);line-height:1.2;}
    .product-rating-row{display:flex;align-items:center;gap:10px;}
    .stars{color:var(--gold);font-size:14px;letter-spacing:2px;}
    .review-count{font-size:13px;color:var(--muted);}
    .product-price-row{display:flex;align-items:baseline;gap:10px;}
    .price-main{font-family:'Playfair Display',serif;font-size:2.2rem;color:var(--brand-dark);}
    .price-main.premix-price{color:var(--premix-dark);}
    .price-mrp{font-size:16px;color:var(--muted);text-decoration:line-through;}
    .price-off{font-size:13px;font-weight:500;color:#16A34A;background:#DCFCE7;padding:2px 8px;border-radius:20px;}
    .product-desc{font-size:15px;color:var(--muted);line-height:1.7;}
    
    /* META CHIPS */
    .meta-chips{display:flex;gap:8px;flex-wrap:wrap;}
    .meta-chip{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:var(--radius-sm);padding:8px 14px;font-size:13px;color:var(--text);}
    .meta-chip i{font-size:16px;color:var(--brand);}

    /* DIVIDER */
    .divider{height:0.5px;background:#E8E6E0;}

    /* QUANTITY */
    .qty-label{font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px;}
    .qty-row{display:flex;align-items:center;gap:12px;}
    .qty-ctrl{display:flex;align-items:center;gap:0;}
    .qty-btn{width:36px;height:36px;border:0.5px solid #D3D1C7;background:var(--white);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .2s;}
    .qty-btn:first-child{border-radius:var(--radius-sm) 0 0 var(--radius-sm);}
    .qty-btn:last-child{border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
    .qty-btn:hover{background:var(--brand-light);border-color:var(--brand);color:var(--brand);}
    .qty-num{width:44px;height:36px;border:0.5px solid #D3D1C7;border-left:none;border-right:none;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:500;}

    /* ACTION BUTTONS */
    .action-btns{display:flex;flex-direction:column;gap:10px;}
    .btn-add-cart{width:100%;background:var(--brand);color:white;border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s;}
    .btn-add-cart:hover{background:var(--brand-dark);}
    .btn-add-cart.premix-btn{background:var(--premix);}
    .btn-add-cart.premix-btn:hover{background:var(--premix-dark);}
    .btn-whatsapp{width:100%;background:#25D366;color:white;border:none;border-radius:var(--radius-sm);padding:14px;font-size:15px;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .2s;}
    .btn-whatsapp:hover{opacity:0.9;}

    /* FEATURES */
    .features-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .feature-item{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border-radius:var(--radius-sm);padding:12px;}
    .feature-icon{width:32px;height:32px;border-radius:8px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
    .feature-icon i{font-size:16px;color:var(--brand);}
    .feature-icon.premix-icon{background:var(--premix-light);}
    .feature-icon.premix-icon i{color:var(--premix-dark);}
    .feature-title{font-size:12px;font-weight:500;color:var(--text);}
    .feature-sub{font-size:11px;color:var(--muted);margin-top:2px;}

    /* TABS */
    .tabs{display:flex;gap:0;border-bottom:0.5px solid #D3D1C7;}
    .tab-btn{padding:10px 20px;font-size:14px;font-weight:500;color:var(--muted);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;border-bottom:2px solid transparent;margin-bottom:-0.5px;transition:all .2s;}
    .tab-btn.active{color:var(--brand);border-bottom-color:var(--brand);}
    .tab-content{display:none;padding-top:1.2rem;}
    .tab-content.active{display:block;}
    .ingredients-list{display:flex;flex-wrap:wrap;gap:8px;}
    .ingredient-chip{background:var(--surface);border-radius:20px;padding:5px 14px;font-size:13px;color:var(--text);}
    .how-to-list{list-style:none;display:flex;flex-direction:column;gap:10px;}
    .how-to-list li{display:flex;gap:12px;font-size:14px;color:var(--muted);line-height:1.6;}
    .how-to-num{width:24px;height:24px;border-radius:50%;background:var(--brand-light);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0;margin-top:2px;}

    /* RELATED PRODUCTS */
    .related-section{max-width:1100px;margin:0 auto;padding:0 2rem 3rem;}
    .related-title{font-family:'Playfair Display',serif;font-size:1.4rem;color:var(--brand-dark);margin-bottom:1.2rem;}
    .related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
    .related-card{background:var(--white);border:0.5px solid #D3D1C7;border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .2s,border-color .2s;text-decoration:none;display:block;}
    .related-card:hover{transform:translateY(-3px);border-color:#B4B2A9;}
    .related-img{height:120px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;}
    .related-img.pickle-bg{background:var(--brand-light);}
    .related-img.premix-bg{background:var(--premix-light);}
    .related-info{padding:10px 12px;}
    .related-name{font-size:13px;font-weight:500;color:var(--text);margin-bottom:4px;}
    .related-price{font-family:'Playfair Display',serif;font-size:16px;color:var(--brand-dark);}

    /* REVIEWS */
    .reviews-section{max-width:1100px;margin:0 auto;padding:0 2rem 3rem;}
    .review-card{background:var(--white);border:0.5px solid #D3D1C7;border-radius:var(--radius);padding:1.25rem;margin-bottom:1rem;}
    .reviewer{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
    .reviewer-avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:14px;color:var(--brand-dark);}
    .reviewer-name{font-size:14px;font-weight:500;}
    .reviewer-date{font-size:11px;color:var(--muted);}
    .review-text{font-size:13px;line-height:1.6;color:var(--muted);}

    /* TOAST */
    .toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(100px);background:var(--brand-dark);color:#fff;padding:12px 24px;border-radius:var(--radius-sm);font-size:14px;font-weight:500;z-index:400;transition:transform .3s;pointer-events:none;}
    .toast.show{transform:translateX(-50%) translateY(0);}

    /* FOOTER */
    footer{background:var(--brand-dark);color:rgba(255,255,255,0.8);padding:2rem;display:flex;justify-content:space-between;align-items:center;margin-top:2rem;}
    .footer-brand{font-family:'Playfair Display',serif;font-size:18px;color:#fff;margin-bottom:4px;}
    .footer-tagline{font-size:12px;opacity:.6;}
    .footer-contact{font-size:13px;text-align:right;}
    .footer-contact a{color:#FAC775;text-decoration:none;}

    /* WhatsApp Float */
    .whatsapp-float{position:fixed;bottom:2rem;right:2rem;z-index:999;display:flex;flex-direction:column;align-items:flex-end;gap:0.6rem;}
    .whatsapp-float-btn{width:54px;height:54px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.4);text-decoration:none;transition:transform .2s;}
    .whatsapp-float-btn:hover{transform:scale(1.1);}
    .wa-pulse{position:absolute;width:54px;height:54px;border-radius:50%;background:#25D366;opacity:0.4;animation:wp-pulse 2s ease-out infinite;}
    @keyframes wp-pulse{0%{transform:scale(1);opacity:0.4;}100%{transform:scale(1.7);opacity:0;}}

    @media(max-width:480px){
      .features-grid{grid-template-columns:1fr;}
      .product-title{font-size:1.5rem;}
      .price-main{font-size:1.8rem;}
      footer{flex-direction:column;gap:1rem;text-align:center;}
      .footer-contact{text-align:center;}
    }
  </style>
</head>

<script>
  const API_BASE = 'https://maa-chef-amma.onrender.com';
  const WA_NUMBER = '919989340476';
  let product = null;
  let allProducts = [];
  let qty = 1;

  // Get product ID from URL
  const params = new URLSearchParams(window.location.search);
  const productId = params.get('id');

  // Redirect if no ID
  if (!productId) window.location.href = 'index.html';

  // Spice level info
  const spiceInfo = {
    'Hot': { level: 3, color: '#EF4444', label: 'Hot 🌶️🌶️🌶️' },
    'Medium': { level: 2, color: '#F97316', label: 'Medium 🌶️🌶️' },
    'Mild': { level: 1, color: '#EAB308', label: 'Mild 🌶️' },
    '': { level: 0, color: '#6B7280', label: 'No Spice' }
  };

  // Ingredients per product (can be expanded)
  const ingredientMap = {
    'chicken': ['Fresh Chicken', 'Red Chili', 'Turmeric', 'Mustard Seeds', 'Sesame Oil', 'Garlic', 'Ginger', 'Curry Leaves', 'Salt', 'Vinegar'],
    'premix': ['Rice', 'Urad Dal', 'Fenugreek Seeds', 'Salt', 'Natural Flavors']
  };

  const howToMap = {
    'chicken': [
      'Best served as a side dish with hot rice or roti.',
      'Can be mixed with curd rice for a delicious combination.',
      'Use a clean, dry spoon each time to maintain freshness.',
      'Store in a cool, dry place. Refrigerate after opening.',
      'Consume within 3 months of opening for best taste.'
    ],
    'premix': [
      'Take required quantity of premix powder in a bowl.',
      'Add water gradually and mix to get a smooth batter.',
      'Let the batter ferment for 6-8 hours.',
      'Pour into idly moulds and steam for 10-12 minutes.',
      'Serve hot with sambar and chutney.'
    ]
  };

  function renderStars(n) {
    return '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n));
  }

  function getDiscount(price, mrp) {
    if (!mrp || mrp <= price) return null;
    return Math.round(((mrp - price) / mrp) * 100);
  }

  function buildProductHTML(p) {
    const isPremix = p.category === 'premix';
    const bgClass = isPremix ? 'premix-bg' : 'pickle-bg';
    const tagClass = isPremix ? 'tag-premix' : 'tag-pickle';
    const discount = getDiscount(p.price, p.mrp);
    const spice = spiceInfo[p.spice] || spiceInfo[''];
    const ingredients = ingredientMap[p.category] || [];
    const howTo = howToMap[p.category] || [];

    return `
    <div class="product-page">

      <!-- LEFT: Visual -->
      <div class="product-visual">
       <div class="product-img-box ${p.image_url ? '' : bgClass}" id="mainImgBox">
        ${p.badge_text ? `<span class="product-badge-large ${p.badge === 'bestseller' ? 'badge-bestseller' : 'badge-new'}">${p.badge_text}</span>` : ''}
        ${p.image_url 
         ? `<img src="${p.image_url}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;display:block;border-radius:var(--radius);">` 
         : `<i class="ti ${p.icon || 'ti-drumstick'}" style="font-size:120px;opacity:0.25;color:${isPremix ? 'var(--premix-dark)' : 'var(--brand-dark)'}"></i>`
        }
       </div>
        <div class="thumb-row">
          <div class="thumb ${bgClass} active">
            <i class="ti ${p.icon || 'ti-drumstick'}"></i>
          </div>
          <div class="thumb ${bgClass}">
            <i class="ti ti-jar"></i>
          </div>
          <div class="thumb ${bgClass}">
            <i class="ti ti-award"></i>
          </div>
        </div>
      </div>

      <!-- RIGHT: Info -->
      <div class="product-info">
        <div>
          <span class="product-category-tag ${tagClass}">${isPremix ? 'Premix Powder' : 'Chicken Pickle'}</span>
        </div>

        <h1 class="product-title">${p.name}</h1>

        <div class="product-rating-row">
          <span class="stars">${renderStars(p.rating)}</span>
          <span class="review-count">${p.rating} · ${p.review_count} reviews</span>
        </div>

        <div class="product-price-row">
          <span class="price-main ${isPremix ? 'premix-price' : ''}">₹${p.price}</span>
          ${p.mrp ? `<span class="price-mrp">₹${p.mrp}</span>` : ''}
          ${discount ? `<span class="price-off">${discount}% off</span>` : ''}
        </div>

        <p class="product-desc">${p.description}</p>

        <div class="meta-chips">
          <div class="meta-chip"><i class="ti ti-weight"></i> ${p.weight}</div>
          ${p.spice ? `<div class="meta-chip"><i class="ti ti-flame"></i> ${spice.label}</div>` : ''}
          <div class="meta-chip"><i class="ti ti-leaf"></i> No Preservatives</div>
          <div class="meta-chip"><i class="ti ti-home"></i> Homemade</div>
        </div>

        <div class="divider"></div>

        <!-- Quantity -->
        <div>
          <div class="qty-label">Quantity</div>
          <div class="qty-row">
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <div class="qty-num" id="qtyDisplay">1</div>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <span style="font-size:13px;color:var(--muted);">Total: <strong style="color:var(--brand-dark);" id="totalPrice">₹${p.price}</strong></span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="action-btns">
          <button class="btn-add-cart ${isPremix ? 'premix-btn' : ''}" onclick="addToCartAndGo()">
            <i class="ti ti-shopping-cart"></i> Add to Cart & Order
          </button>
          <button class="btn-whatsapp" onclick="orderWhatsApp()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Order via WhatsApp
          </button>
        </div>

        <div class="divider"></div>

        <!-- Features -->
        <div class="features-grid">
          <div class="feature-item">
            <div class="feature-icon ${isPremix ? 'premix-icon' : ''}"><i class="ti ti-truck-delivery"></i></div>
            <div><div class="feature-title">Pan-India Delivery</div><div class="feature-sub">Ships within 2-3 days</div></div>
          </div>
          <div class="feature-item">
            <div class="feature-icon ${isPremix ? 'premix-icon' : ''}"><i class="ti ti-shield-check"></i></div>
            <div><div class="feature-title">FSSAI Certified</div><div class="feature-sub">100% safe & hygienic</div></div>
          </div>
          <div class="feature-item">
            <div class="feature-icon ${isPremix ? 'premix-icon' : ''}"><i class="ti ti-refresh"></i></div>
            <div><div class="feature-title">Easy Returns</div><div class="feature-sub">7-day return policy</div></div>
          </div>
          <div class="feature-item">
            <div class="feature-icon ${isPremix ? 'premix-icon' : ''}"><i class="ti ti-heart"></i></div>
            <div><div class="feature-title">Made with Love</div><div class="feature-sub">Traditional recipe</div></div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Tabs -->
        <div>
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ingredients', this)">Ingredients</button>
            <button class="tab-btn" onclick="switchTab('howto', this)">How to Use</button>
            <button class="tab-btn" onclick="switchTab('storage', this)">Storage</button>
          </div>
          <div class="tab-content active" id="tab-ingredients">
            <div class="ingredients-list">
              ${ingredients.map(i => `<span class="ingredient-chip">${i}</span>`).join('')}
            </div>
          </div>
          <div class="tab-content" id="tab-howto">
            <ul class="how-to-list">
              ${howTo.map((s, i) => `<li><div class="how-to-num">${i+1}</div><div>${s}</div></li>`).join('')}
            </ul>
          </div>
          <div class="tab-content" id="tab-storage">
            <ul class="how-to-list">
              <li><div class="how-to-num">1</div><div>Store in a cool, dry place away from direct sunlight.</div></li>
              <li><div class="how-to-num">2</div><div>Always use a clean, dry spoon to avoid contamination.</div></li>
              <li><div class="how-to-num">3</div><div>Refrigerate after opening for extended freshness.</div></li>
              <li><div class="how-to-num">4</div><div>Best consumed within 3 months of opening.</div></li>
              <li><div class="how-to-num">5</div><div>Keep the lid tightly closed when not in use.</div></li>
            </ul>
          </div>
        </div>

      </div>
    </div>`;
  }

  function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  function changeQty(delta) {
    qty = Math.max(1, qty + delta);
    document.getElementById('qtyDisplay').textContent = qty;
    document.getElementById('totalPrice').textContent = '₹' + (product.price * qty);
  }

  function orderWhatsApp() {
    const msg = `Hi! I'd like to order *${product.name}* x${qty} = ₹${product.price * qty} from Maa Chef Amma 🫙`;
    window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  function addToCartAndGo() {
    // Store cart item in sessionStorage and go back to index
    const cartItem = { ...product, qty };
    const existing = JSON.parse(sessionStorage.getItem('pendingCartItem') || 'null');
    sessionStorage.setItem('pendingCartItem', JSON.stringify(cartItem));
    showToast(`${product.name} added to cart!`);
    setTimeout(() => { window.location.href = 'index.html?addToCart=' + product.id + '&qty=' + qty; }, 800);
  }

  function renderRelated(products) {
    const related = products.filter(p => p.id !== parseInt(productId)).slice(0, 4);
    if (!related.length) return;
    document.getElementById('relatedSection').style.display = 'block';
    document.getElementById('relatedGrid').innerHTML = related.map(p => `
      <a href="product.html?id=${p.id}" class="related-card">
        <div class="related-img ${p.category === 'premix' ? 'premix-bg' : 'pickle-bg'}">
          <i class="ti ${p.icon}" style="font-size:40px;color:${p.category === 'premix' ? 'var(--premix-dark)' : 'var(--brand-dark)'};opacity:0.4;"></i>
        </div>
        <div class="related-info">
          <div class="related-name">${p.name}</div>
          <div class="related-price ${p.category === 'premix' ? 'premix-price' : ''}">₹${p.price}</div>
        </div>
      </a>
    `).join('');
  }

  function renderReviews(reviews) {
    if (!reviews.length) return;
    document.getElementById('reviewsSection').style.display = 'block';
    document.getElementById('reviewsList').innerHTML = reviews.slice(0, 4).map(r => `
      <div class="review-card">
        <div class="reviewer">
          <div class="reviewer-avatar">${r.initials}</div>
          <div><div class="reviewer-name">${r.reviewer_name}</div><div class="reviewer-date">${r.date_label}</div></div>
        </div>
        <div class="stars" style="font-size:13px;margin-bottom:6px;">${renderStars(r.stars)}</div>
        <div class="review-text">"${r.review_text}"</div>
      </div>
    `).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Load product + all products + reviews
  async function init() {
    try {
      const [productsRes, reviewsRes] = await Promise.all([
        fetch(`${API_BASE}/api/products/`),
        fetch(`${API_BASE}/api/reviews/`)
      ]);
      allProducts = await productsRes.json();
      const reviews = await reviewsRes.json();

      product = allProducts.find(p => p.id === parseInt(productId));
      if (!product) {
        document.getElementById('pageContent').innerHTML = `
          <div class="loading-state">
            <i class="ti ti-alert-circle"></i>
            Product not found. <a href="index.html" style="color:var(--brand);">Go back</a>
          </div>`;
        return;
      }

      // Update page title & breadcrumb
      document.title = `${product.name} — Maa Chef Amma`;
      document.getElementById('breadcrumbName').textContent = product.name;

      // Render product
      document.getElementById('pageContent').innerHTML = buildProductHTML(product);

      // Render related & reviews
      renderRelated(allProducts);
      renderReviews(reviews);

    } catch(e) {
      document.getElementById('pageContent').innerHTML = `
        <div class="loading-state">
          <i class="ti ti-wifi-off"></i>
          Could not load product. Please check your connection.
        </div>`;
    }
  }

  init();
</script>
</body>
</html>
