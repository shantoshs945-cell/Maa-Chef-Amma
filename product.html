  document.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    cursor.style.transform = `translate(${mx - 5}px, ${my - 5}px)`;
  });
  function animRing() {
    rx += (mx - rx) * 0.14; ry += (my - ry) * 0.14;
    cursorRing.style.transform = `translate(${rx - 18}px, ${ry - 18}px)`;

  const spiceInfo = {

  function renderStars(n) { return '★'.repeat(Math.round(n)) + '☆'.repeat(5 - Math.round(n)); }
  function getDiscount(price, mrp) {
    if (!mrp || mrp <= price) return null;
    return Math.round(((mrp - price) / mrp) * 100);

  function buildProductHTML(p) {
    const isPremix = p.category === 'premix';
    const discount = getDiscount(p.price, p.mrp);
    const spice = spiceInfo[p.spice] || spiceInfo[''];

    return `
    <div class="product-page">
      <!-- LEFT: Visual -->
      <div class="product-visual">
        <div class="product-img-box" id="mainImgBox">
          ${p.badge_text ? `<span class="product-badge-large ${p.badge === 'bestseller' ? 'badge-bestseller' : 'badge-new'}">${p.badge_text}</span>` : ''}
          ${p.image_url
            ? `<img src="${p.image_url}" alt="${p.name}">`
            : `<i class="ti ${p.icon || 'ti-drumstick'}" style="font-size:100px;opacity:0.15;color:var(--gold);"></i>`
          }
        </div>
      </div>

      <!-- RIGHT: Info -->
      <div class="product-info">
        <span class="product-category-tag">${p.category_name || p.category}</span>

        <h1 class="product-title">${p.name}</h1>

        <div class="product-rating-row">
          <span class="stars">${renderStars(p.rating)}</span>
          <span class="review-count">${p.rating} · ${p.review_count} reviews</span>
        </div>

        <div class="product-price-row">
          <span class="price-main">₹${p.price}</span>
          ${p.mrp ? `<span class="price-mrp">₹${p.mrp}</span>` : ''}
          ${discount ? `<span class="price-off">${discount}% off</span>` : ''}
        </div>

        <p class="product-desc">${p.description}</p>

        <div class="meta-chips">
          <div class="meta-chip"><i class="ti ti-weight"></i>${p.weight}</div>
          ${p.spice ? `<div class="meta-chip"><i class="ti ti-flame"></i>${spice.label}</div>` : ''}
          <div class="meta-chip"><i class="ti ti-leaf"></i>No Preservatives</div>
          <div class="meta-chip"><i class="ti ti-home"></i>Homemade</div>
        </div>

        <div class="divider"></div>

      <!-- Weight Variants -->
       ${p.variants && p.variants.length ? `
       <div>
         <div class="qty-label">Select Weight</div>
           <div style="display:flex;gap:8px;flex-wrap:wrap;" id="variantSelector">
             ${p.variants.map((v, i) => `
              <button
                     onclick="selectVariant(${i})"
                   id="variant-${i}"
                style="background:${i === 0 ? 'var(--gold)' : 'transparent'};
               color:${i === 0 ? 'var(--dark)' : 'var(--cream)'};
               border:0.5px solid ${i === 0 ? 'var(--gold)' : 'rgba(201,160,37,0.3)'};
               border-radius:var(--radius-sm);padding:8px 16px;
               font-family:'DM Sans',sans-serif;font-size:13px;
               cursor:pointer;transition:all 0.2s;">
        ${v.weight}
        <span style="display:block;font-size:11px;opacity:0.8;">₹${v.price}</span>
      </button>
    `).join('')}
  </div>
</div>
` : ''}
        <!-- Quantity -->
        <div>
          <div class="qty-label">Quantity</div>
          <div class="qty-row">
            <div class="qty-ctrl">
              <button class="qty-btn" onclick="changeQty(-1)">−</button>
              <div class="qty-num" id="qtyDisplay">1</div>
              <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <span class="total-label">Total: <strong id="totalPrice">₹${p.price}</strong></span>
          </div>
        </div>

        <!-- Buttons -->
        <div class="action-btns">
          <button class="btn-add-cart" onclick="addToCartAndGo()">
            <i class="ti ti-shopping-cart"></i> Add to Cart & Order
          </button>
          <button class="btn-whatsapp" onclick="orderWhatsApp()">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Order via WhatsApp
          </button>
        </div>

        <div class="divider"></div>

        <!-- Features -->
        <div class="features-grid">
          <div class="feature-item">
            <div class="feature-icon"><i class="ti ti-truck-delivery"></i></div>
            <div><div class="feature-title">Pan-India Delivery</div><div class="feature-sub">Ships within 2-3 days</div></div>
          </div>
          <div class="feature-item">
            <div class="feature-icon"><i class="ti ti-shield-check"></i></div>
            <div><div class="feature-title">FSSAI Certified</div><div class="feature-sub">100% safe & hygienic</div></div>
          </div>
          <div class="feature-item">
            <div class="feature-icon"><i class="ti ti-heart"></i></div>
            <div><div class="feature-title">Made with Love</div><div class="feature-sub">Traditional recipe</div></div>
          </div>
        </div>

        <div class="divider"></div>

        <!-- Tabs -->
        <div>
          <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('ingredients', this)">Ingredients</button>
            <button class="tab-btn" onclick="switchTab('howto', this)">How to Use</button>
            <button class="tab-btn" onclick="switchTab('storage', this)">Storage</button>
          </div>
          <div class="tab-content active" id="tab-ingredients">
  <div class="ingredients-list">
    ${p.ingredients
      ? p.ingredients.split(',').map(i => `<span class="ingredient-chip">${i.trim()}</span>`).join('')
      : '<p style="color:var(--muted);font-size:13px;">No ingredients listed.</p>'
    }
  </div>
</div>
<div class="tab-content" id="tab-howto">
  <ul class="how-to-list">
    ${p.how_to_use
      ? p.how_to_use.split('\n').filter(s => s.trim()).map((s, i) => `<li><div class="how-to-num">${i+1}</div><div>${s.trim()}</div></li>`).join('')
      : '<p style="color:var(--muted);font-size:13px;">No instructions listed.</p>'
    }
   </ul>
   </div>
    <div class="tab-content" id="tab-storage">
     <ul class="how-to-list">
      ${p.storage_info
          ? p.storage_info.split('\n').filter(s => s.trim()).map((s, i) => `<li><div class="how-to-num">${i+1}</div><div>${s.trim()}</div></li>`).join('')
           : '<p style="color:var(--muted);font-size:13px;">No storage info listed.</p>'
       }
       </ul>
       </div>
        </div>
      </div>
    </div>`;
  }

  // ─── VARIANT SELECTOR ───────────────────────────
let selectedVariantIndex = 0;

function selectVariant(index) {
  if (!product.variants) return;
  selectedVariantIndex = index;
  const variant = product.variants[index];

  // Update price display
  document.getElementById('totalPrice').textContent = '₹' + (variant.price * qty);

  // Update all variant buttons
  product.variants.forEach((v, i) => {
    const btn = document.getElementById(`variant-${i}`);
    if (!btn) return;
    if (i === index) {
      btn.style.background = 'var(--gold)';
      btn.style.color = 'var(--dark)';
      btn.style.borderColor = 'var(--gold)';
    } else {
      btn.style.background = 'transparent';
      btn.style.color = 'var(--cream)';
      btn.style.borderColor = 'rgba(201,160,37,0.3)';
    }
  });

  // Update price row
  const priceMain = document.querySelector('.price-main');
  const priceMrp = document.querySelector('.price-mrp');
  const priceOff = document.querySelector('.price-off');
  if (priceMain) priceMain.textContent = '₹' + variant.price;
  if (priceMrp) priceMrp.textContent = variant.mrp ? '₹' + variant.mrp : '';
  if (priceOff && variant.mrp) {
    const disc = Math.round(((variant.mrp - variant.price) / variant.mrp) * 100);
    priceOff.textContent = disc + '% off';
  }
}
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + name).classList.add('active');
  }

  function changeQty(delta) {
  qty = Math.max(1, qty + delta);
  document.getElementById('qtyDisplay').textContent = qty;
  const price = product.variants && product.variants[selectedVariantIndex]
    ? product.variants[selectedVariantIndex].price
    : product.price;
  document.getElementById('totalPrice').textContent = '₹' + (price * qty);
}

  function orderWhatsApp() {
  const variant = product.variants && product.variants[selectedVariantIndex]
    ? ` (${product.variants[selectedVariantIndex].weight})`
    : '';
  const price = product.variants && product.variants[selectedVariantIndex]
    ? product.variants[selectedVariantIndex].price
    : product.price;
  const msg = `Hi! I'd like to order *${product.name}${variant}* x${qty} = ₹${price * qty} from Maa Chef Amma 🫙`;
  window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
}

  function addToCartAndGo() {
    sessionStorage.setItem('pendingCartItem', JSON.stringify({ ...product, qty }));
    showToast(`${product.name} added to cart!`);
    setTimeout(() => { window.location.href = 'index.html?addToCart=' + product.id + '&qty=' + qty; }, 800);
  }

  function renderRelated(products) {
    const related = products.filter(p => p.id !== parseInt(productId)).slice(0, 4);
    if (!related.length) return;
    document.getElementById('relatedSection').style.display = 'block';
    document.getElementById('relatedGrid').innerHTML = related.map(p => `
      <a href="product.html?id=${p.id}" class="related-card">
        <div class="related-img">
          ${p.image_url
            ? `<img src="${p.image_url}" alt="${p.name}">`
            : `<i class="ti ${p.icon}" style="font-size:40px;color:var(--gold);opacity:0.3;"></i>`
          }
        </div>
        <div class="related-info">
          <div class="related-name">${p.name}</div>
          <div class="related-price">₹${p.price}</div>
        </div>
      </a>
    `).join('');
  }

  function renderReviews(reviews) {
    if (!reviews.length) return;
    document.getElementById('reviewsSection').style.display = 'block';
    document.getElementById('reviewsList').innerHTML = reviews.slice(0, 4).map(r => `
      <div class="review-card">
        <div class="reviewer">
          <div class="reviewer-avatar">${r.initials}</div>
          <div><div class="reviewer-name">${r.reviewer_name}</div><div class="reviewer-date">${r.date_label}</div></div>
        </div>
        <div class="stars" style="font-size:13px;margin-bottom:8px;">${renderStars(r.stars)}</div>
        <div class="review-text">"${r.review_text}"</div>
      </div>
    `).join('');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  async function init() {
  try {
    const [productsRes, reviewsRes, categoriesRes] = await Promise.all([
      fetch(`${API_BASE}/api/products/`),
      fetch(`${API_BASE}/api/reviews/`),
      fetch(`${API_BASE}/api/categories/`)
    ]);
    allProducts = await productsRes.json();
    const reviews = await reviewsRes.json();
    const categories = await categoriesRes.json();

    // Map slug → name
    const catMap = {};
    categories.forEach(c => catMap[c.slug] = c.name);

    product = allProducts.find(p => p.id === parseInt(productId));

    if (!product) {
      document.getElementById('pageContent').innerHTML = `
        <div class="loading-state">
          <i class="ti ti-alert-circle"></i>
          Product not found. <a href="index.html" style="color:var(--gold);">Go back</a>
        </div>`;
      return;
    }

    // Add human-readable category name
    product.category_name = catMap[product.category] || product.category;

    document.title = `${product.name} — Maa Chef Amma`;
    document.getElementById('breadcrumbName').textContent = product.name;
    document.getElementById('pageContent').innerHTML = buildProductHTML(product);
    renderRelated(allProducts);
    renderReviews(reviews);

  } catch(e) {
    document.getElementById('pageContent').innerHTML = `
      <div class="loading-state">
        <i class="ti ti-wifi-off"></i>
        Could not load product. Please check your connection.
      </div>`;
  }
}

  init();
</script>
</body>
</html>
